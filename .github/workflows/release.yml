name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Verify / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -q

      - name: Compile Python sources
        run: python -m compileall -q gateway remote_agent agent.py tests

      - name: Check frontend JavaScript
        run: node --check gateway/static/app.js

      - name: Check repository diff
        run: git diff --check

  publish:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate tag and project versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          project = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          package_version = project["project"]["version"]
          version_source = pathlib.Path("remote_agent/core/version.py").read_text(encoding="utf-8")
          match = re.search(r'^AGENT_VERSION = "([^"]+)"$', version_source, re.MULTILINE)
          if match is None:
              raise SystemExit("AGENT_VERSION was not found")

          agent_version = match.group(1)
          release_tag = os.environ["RELEASE_TAG"]
          expected_tag = f"v{package_version}"
          if release_tag != expected_tag:
              raise SystemExit(f"tag {release_tag!r} does not match project version {expected_tag!r}")
          if agent_version != package_version:
              raise SystemExit(
                  f"Agent version {agent_version!r} does not match package version {package_version!r}"
              )

          print(f"Validated {release_tag}: package={package_version}, agent={agent_version}")
          PY

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel contents
        run: |
          python - <<'PY'
          import os
          import pathlib
          import zipfile

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheels = list(pathlib.Path("dist").glob(f"remote_agent_gateway-{version}-*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"expected one release wheel, found: {wheels}")

          required = {
              "gateway/static/index.html",
              "gateway/static/app.js",
              "gateway/static/styles.css",
              "remote_agent/manifest.json",
              f"remote_agent_gateway-{version}.dist-info/licenses/LICENSE",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              missing = required.difference(archive.namelist())
          if missing:
              raise SystemExit(f"wheel is missing required files: {sorted(missing)}")

          print(f"Verified {wheels[0]}")
          PY

      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.whl > SHA256SUMS.txt

      - name: Create or update GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/*.whl dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/*.whl dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --prerelease \
              --generate-notes \
              --title "Remote Agent Gateway $GITHUB_REF_NAME"
          fi
